<!doctype html><html lang="ru"><head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Админ · NiNo</title><link href="./style.css" rel="stylesheet"/>
  <script src="./db.js"></script>
  <script src="./ui.js"></script>
  <script>
  (async ()=>{
    await new Promise(r => window.addEventListener("DOMContentLoaded", r));
    await window.storageReady;
  const {el,table,getSubjects,getGroups,addAssignment:storageAddAssignment,addTimetable:storageAddTimetable,addStaffEntry:storageAddStaffEntry,exportData,importDataFile} = window;
    const app=document.getElementById("app");

    const addAssignment=el("form",{class:"card row",onsubmit:e=>{
      e.preventDefault();
      const subject_id=Number(e.target.subj.value),title=e.target.title.value.trim();
      const due=e.target.due.value||null,link=e.target.link.value||null;
      if(!subject_id||!title) return alert("Заполните предмет и заголовок");
  storageAddAssignment({subject_id,title,due_date:due,link});
  alert("Добавлено");
    }},[
      el("b",{},["Добавить ДЗ"]),
      (()=>{
          const s=el("select",{name:"subj",class:"input"});
          getSubjects().forEach(x=>s.append(el("option",{value:x.id},[x.name])));
        return s;
      })(),
      el("input",{name:"title",class:"input",placeholder:"Заголовок"}),
      el("input",{name:"due",class:"input",type:"date"}),
      el("input",{name:"link",class:"input",placeholder:"Ссылка (необязательно)"}),
      el("button",{class:"btn",type:"submit"},["Сохранить"])
    ]);

    const addSchedule=el("form",{class:"card row",onsubmit:e=>{
      e.preventDefault();
      const group_id=Number(e.target.group.value),subject_id=Number(e.target.subj.value);
      const day=e.target.day.value,slot=e.target.time.value.trim();
      if(!group_id||!subject_id||!day||!slot) return alert("Заполните все поля");
      storageAddTimetable({group_id,subject_id,day,week:0,slot}); alert("Добавлено");
    }},[
      el("b",{},["Добавить в расписание"]),
      (()=>{
    const s=el("select",{name:"group",class:"input"});
  getGroups().forEach(g=>s.append(el("option",{value:g.id},[g.name]))); return s;
      })(),
      (()=>{
  const s=el("select",{name:"subj",class:"input"});
  getSubjects().forEach(x=>s.append(el("option",{value:x.id},[x.name]))); return s;
      })(),
      (()=>{
        const s=el("select",{name:"day",class:"input"});
        ["mon","tue","wed","thu","fri","sat"].forEach(d=>s.append(el("option",{value:d},[d]))); return s;
      })(),
      el("input",{name:"time",class:"input",placeholder:"09:00-10:30"}),
      el("button",{class:"btn",type:"submit"},["Сохранить"])
    ]);

    const addStaff=el("form",{class:"card row",onsubmit:e=>{
      e.preventDefault(); const name=e.target.name.value.trim(),email=e.target.email.value.trim();
      if(!name||!email) return alert("Заполните поля");
  storageAddStaffEntry({name,email}); alert("Добавлено");
    }},[
      el("b",{},["Добавить сотрудника"]),
      el("input",{name:"name",class:"input",placeholder:"ФИО"}),
      el("input",{name:"email",class:"input",placeholder:"email@uni.edu"}),
      el("button",{class:"btn",type:"submit"},["Сохранить"])
    ]);

    const backup=el("div",{class:"card row"},[
      el("b",{},["Резервные копии"]),
      (()=>{
        const b=el("button",{class:"btn"},["Скачать .json"]);
        b.addEventListener("click",()=>{ const blob=exportData(); const a=document.createElement("a");
          a.href=URL.createObjectURL(blob); a.download="nino.json"; a.click(); });
        return b;
      })(),
  (()=>{
    const inp=el("input",{type:"file",accept:".json"});
  inp.addEventListener("change",async()=>{ const f=inp.files[0]; if(!f) return; await importDataFile(f); alert("Импортировано"); });
    return inp;
  })()
    ]);

    app.append(addAssignment,addSchedule,addStaff,backup);
  })();
  </script>
</head><body>
  <header class="topbar"><a class="link" href="./index.html">← На главную</a></header>
  <main id="app"></main><footer class="footer">Администрирование</footer>
</body></html>
