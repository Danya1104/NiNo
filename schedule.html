<!doctype html><html lang="ru"><head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Расписание · NiNo</title><link href="./css/style.css" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
  <script type="module">
    import {query} from "./js/db.js"; import {el,table} from "./js/ui.js";
    await new Promise(r=>window.addEventListener("DOMContentLoaded",r));
    const app=document.getElementById("app");
    const filters=el("div",{class:"row"},[
      el("label",{},["Группа: "]),
      (()=>{const s=el("select"); query("SELECT * FROM groups").forEach(g=>s.append(el("option",{value:g.id},[g.name]))); s.addEventListener("change",draw); return s;})(),
      el("label",{},["День: "]),
      (()=>{const s=el("select"); ["mon","tue","wed","thu","fri","sat"].forEach(d=>s.append(el("option",{value:d},[d]))); s.addEventListener("change",draw); return s;})()
    ]);
    const box=el("div",{class:"card"}); app.append(filters,box);
    function draw(){
      const [gSel,dSel]=filters.querySelectorAll("select");
      const rows=query(`
        SELECT s.name subject, t.slot FROM timetable t
        JOIN subjects s ON s.id=t.subject_id
        WHERE t.group_id=? AND t.day=? ORDER BY t.slot;
      `,[gSel.value,dSel.value]).map((r,i)=>[String(i+1),r.subject,r.slot]);
      box.innerHTML=""; box.append(table(["#","Предмет","Время"],rows.length?rows:[["—","—","—"]]));
    } draw();
  </script>
</head><body>
  <header class="topbar"><a class="link" href="./index.html">← На главную</a></header>
  <main id="app"></main><footer class="footer">Просмотр расписания</footer>
</body></html>
